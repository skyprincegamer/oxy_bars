name: Test

on:
  push:
    branches:
      - '**' # Runs on every push

jobs:
  compile-binaries:
    uses: ./.github/workflows/build.yml

  testing:
    needs: compile-binaries
    runs-on: "ubuntu-latest"
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: executables

      - name: Run test
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libfuse2
          APPIMAGE=$(ls executables/*.AppImage | head -n 1)
          chmod +x "$APPIMAGE"
        
          timeout 3 xvfb-run -a "$APPIMAGE" || if [ $? -ne 124 ]; then exit 1; fi