name: Build latest commit

on:
  push:
    branches:
      - '**' # Runs on every push

jobs:
  build-windows:
    name: Build on Windows
    runs-on: "windows-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

  build-linux:
    name: Build on Linux
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 pkg-config libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
          sudo wget -O /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install cargo-appimage
        run: cargo install cargo-appimage

      - name: Build AppImage
        run: cargo appimage
