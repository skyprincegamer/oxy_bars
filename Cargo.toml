[package]
name = "visualizer"
version = "0.0.1"
edition = "2024"

[dependencies]
macroquad = "0.4.14"
rustfft = "6.4.1"
cpal = "0.17.3"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2+spec-1.1.0"
windowfunctions = "0.1.1"

[build-dependencies]
winres = "0.1.12"

[package.metadata.appimage]
assets = ["assets"]
icon = "assets/icon.png"
auto_link = true
auto_link_exclude_list = [
    "libc.so*",
    "libdl.so*",
    "libpthread.so*",
    "libm.so*",
    "librt.so*",
    "libgcc_s.so*",
    "ld-linux*.so*",
    "libstdc++.so*"
]
